#!/usr/sbin/nft -f
# Pare-feu StartupMed — traduction directe de la matrice de flux (Atelier 2)
# Regle d'or : tout flux absent de ce fichier est refuse (policy drop) et journalise.
# Voir les compteurs :  sudo nft list ruleset
# Voir les blocages  :  sudo logs-blocages

flush ruleset

define Z0      = 192.168.56.0/24   # Internet simule (votre PC)
define Z3      = 10.10.3.0/24      # Donnees de sante
define Z4      = 10.10.4.0/24      # Administration
define Z5      = 10.10.5.0/24      # Siege
define FW_Z0   = 192.168.56.10     # Adresse publique du pare-feu
define DMZ     = 10.10.1.10        # WAF / reverse proxy
define APP     = 10.10.2.10        # API metier
define DB      = 10.10.3.10        # PostgreSQL
define BASTION = 10.10.4.10        # Bastion SSH + MFA

table inet filtre {

    # Trafic a destination du pare-feu lui-meme
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        ip saddr 10.0.2.0/24 tcp dport 22 accept comment "Pilotage Vagrant uniquement"
        icmp type echo-request accept
        meta l4proto ipv6-icmp accept comment "Annonces IPv6 de VirtualBox (bruit)"
        counter log prefix "BLOQUE-FW-INPUT " drop
    }

    # Trafic qui traverse le pare-feu (entre zones)
    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        ct state invalid drop

        # F1 — Internet -> WAF (DMZ), HTTPS
        ip saddr $Z0 ip daddr $DMZ tcp dport 443 counter accept comment "F1 Internet vers WAF"

        # F2 — WAF (Z1) -> API metier (Z2), HTTPS
        ip saddr $DMZ ip daddr $APP tcp dport 8443 counter accept comment "F2 WAF vers API"

        # F3 — API metier (Z2) -> PostgreSQL (Z3), TLS
        ip saddr $APP ip daddr $DB tcp dport 5432 counter accept comment "F3 API vers BDD"

        # F6 — Postes du siege (Z5) -> bastion (Z4), SSH + MFA
        ip saddr $Z5 ip daddr $BASTION tcp dport 22 counter accept comment "F6 Siege vers bastion"

        # F7 — Bastion (Z4) -> serveurs Z1/Z2/Z3, SSH par cle
        ip saddr $BASTION ip daddr { $DMZ, $APP, $DB } tcp dport 22 counter accept comment "F7 Bastion vers serveurs"

        # F10 — Serveurs -> collecte de logs sur le bastion (Z4)
        ip saddr { $DMZ, $APP, $DB } ip daddr $BASTION tcp dport 514 counter accept comment "F10 Logs vers Z4"

        # F15 — Siege (Z5) -> Donnees (Z3) : INTERDIT, journalise
        ip saddr $Z5 ip daddr $Z3 counter log prefix "BLOQUE-F15 " drop comment "F15 Siege vers donnees"

        # F16 — Internet -> Administration (Z4) : INTERDIT, journalise
        ip saddr $Z0 ip daddr $Z4 counter log prefix "BLOQUE-F16 " drop comment "F16 Internet vers admin"

        # Tout le reste : flux non documente = flux suspect
        counter log prefix "BLOQUE-NON-DOCUMENTE " drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

# Publication du WAF : 192.168.56.10:443 -> 10.10.1.10:443 (partie NAT de F1)
table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        ip daddr $FW_Z0 tcp dport 443 counter dnat to 10.10.1.10:443 comment "F1 publication du WAF"
    }
}
